
name: Build Ariadna EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project
        run: Expand-Archive -Path Ariadna-GitHub-EXE.zip -DestinationPath project

      - name: Prepare application
        run: Copy-Item project/src/index.html project/desktop/index.html

      - name: Install dependencies
        working-directory: project/desktop
        run: npm install

      - name: Build EXE
        working-directory: project/desktop
        run: npx electron-builder --win portable

      - uses: actions/upload-artifact@v4
        with:
          name: Ariadna-Windows-EXE
          path: project/desktop/dist/Ariadna.exe
          
