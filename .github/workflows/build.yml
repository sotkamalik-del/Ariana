name: Build Ariadna EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath Ariadna-GitHub-EXE.zip -DestinationPath unpacked
          Copy-Item unpacked/desktop desktop -Recurse
          Copy-Item unpacked/src src -Recurse

      - name: Prepare app
        run: Copy-Item src/index.html desktop/index.html -Force
        shell: pwsh

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows EXE
        working-directory: desktop
        run: npx electron-builder --win portable --x64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ariadna-Windows-EXE
          path: desktop/dist/Ariadna.exe
          
